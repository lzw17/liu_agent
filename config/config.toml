# LiuAgent Configuration File

# Server Configuration
[server]
host = "0.0.0.0"
port = 8000
debug = false
cors_origins = ["*"]

# LLM Configuration - Primary model
[llm]
provider = "openai"  # Options: openai, anthropic, azure, ollama, local
model = "gpt-4"
api_key = "your-api-key-here"
base_url = "https://api.openai.com/v1"
max_tokens = 4096
temperature = 0.7
timeout = 30

# Alternative LLM configurations
[llm.deepseek]
provider = "deepseek"
model = "deepseek-chat"
api_key = "your-deepseek-key"
base_url = "https://api.deepseek.com/v1"
max_tokens = 4096
temperature = 0.7

[llm.anthropic]
provider = "anthropic"
model = "claude-3-sonnet-20240229"
api_key = "your-anthropic-key"
base_url = "https://api.anthropic.com/v1"
max_tokens = 4096
temperature = 0.7

[llm.azure]
provider = "azure"
model = "gpt-4"
api_key = "your-azure-key"
base_url = "https://your-resource.openai.azure.com"
api_version = "2024-02-01"
deployment_name = "gpt-4"

[llm.ollama]
provider = "ollama"
model = "llama2"
base_url = "http://localhost:11434/v1"
api_key = "ollama"
max_tokens = 4096
temperature = 0.7

# Knowledge Base Configuration
[knowledge_base]
vector_db_path = "./data/chroma_db"
chunk_size = 1000
chunk_overlap = 200
embedding_model = "all-MiniLM-L6-v2"
max_results = 5

# Web Search Configuration
[search]
primary_engine = "duckduckgo"  # Options: duckduckgo, google, bing
fallback_engines = ["google", "bing"]
max_results = 10
timeout = 10
language = "zh-CN"
region = "cn"

# Google Search API (optional)
[search.google]
api_key = "your-google-api-key"
search_engine_id = "your-search-engine-id"

# File Upload Configuration
[upload]
max_file_size = 10485760  # 10MB in bytes
allowed_extensions = [".pdf", ".docx", ".txt"]
upload_path = "./uploads"

# Database Configuration
[database]
url = "sqlite:///./data/liuagent.db"
# For PostgreSQL: "postgresql://user:password@localhost/dbname"

# Logging Configuration
[logging]
level = "INFO"
file_path = "./logs/liuagent.log"
max_file_size = "10MB"
backup_count = 5
