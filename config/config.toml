# LiuAgent Configuration File

# Server Configuration
[server]
host = "0.0.0.0"
port = 8000
debug = false
cors_origins = ["*"]

# LLM Configuration - Primary model
[llm.qwen-plus]
provider = "openai"  # Options: openai, anthropic, azure, ollama, local
model = "qwen-plus"
api_key = "sk-8979f7d3d763451f97ccf1d682f50ead"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
max_tokens = 4096
temperature = 0.7
timeout = 30

# Alternative LLM configurations
[llm.deepseek]
provider = "deepseek"
model = "deepseek-chat"
api_key = "sk-f7340cd6857a494a9cd7da5863d85da6"
base_url = "https://api.deepseek.com/v1"
max_tokens = 4096
temperature = 0.7

# Knowledge Base Configuration
[knowledge_base]
vector_db_path = "./data/chroma_db"
chunk_size = 1000
chunk_overlap = 200
embedding_model = "all-MiniLM-L6-v2"
max_results = 5

# Web Search Configuration
[search]
primary_engine = "duckduckgo"  # Options: duckduckgo, google, bing
fallback_engines = ["google", "bing"]
max_results = 10
timeout = 10
language = "zh-CN"
region = "cn"

# Google Search API (optional)
[search.google]
api_key = "your-google-api-key"
search_engine_id = "your-search-engine-id"

# File Upload Configuration
[upload]
max_file_size = 10485760  # 10MB in bytes
allowed_extensions = [".pdf", ".docx", ".txt"]
upload_path = "./uploads"

# Database Configuration
[database]
url = "sqlite:///./data/liuagent.db"
# For PostgreSQL: "postgresql://user:password@localhost/dbname"

# Logging Configuration
[logging]
level = "INFO"
file_path = "./logs/liuagent.log"
max_file_size = "10MB"
backup_count = 5
[llm.diqing]
provider = "openai"
model = "deepseek-r1-distill-qwen"
api_key = "sk-e2gqc46XUyv8J5cbMTQbMRyYN0jYEePPwUUk5vLu5tEKh4Wo"
base_url = "http://10.8.0.10:8888/v1"
max_tokens = 4096
temperature = 0.7
timeout = 120
